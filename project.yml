name: AnchorWatch
options:
  bundleIdPrefix: com.jeffmitchell
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "29"
    DEVELOPMENT_TEAM: FD52K7B8M3
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      # Work around SDK cache generation stalls during local development builds.
      SDK_STAT_CACHE_ENABLE: NO
targets:
  AnchorWatch:
    type: application
    platform: iOS
    sources: [AnchorWatch, AnchorWatchShared]
    dependencies:
      - target: AnchorWatchWidgets
      - target: AnchorWatchWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffmitchell.anchorwatch
        SWIFT_OBJC_BRIDGING_HEADER: AnchorWatch/Core/AudioSignal.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: AnchorWatch/AnchorWatch.entitlements
      properties:
        # Lets the alarm notification break through Focus modes. Needs the capability on the App ID.
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: AnchorWatch/Info.plist
      properties:
        CFBundleDisplayName: Anchor Watch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [location, audio]
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSLocationWhenInUseUsageDescription: Anchor Watch uses your location to track the boat relative to the anchor.
        NSLocationAlwaysAndWhenInUseUsageDescription: Anchor Watch keeps tracking the boat while the screen is off so it can sound the drag alarm.
        NSMotionUsageDescription: Anchor Watch reads the phone's barometer to warn when the pressure falls fast, a sign of wind coming.
  AnchorWatchWidgets:
    type: app-extension
    platform: iOS
    sources: [AnchorWatchWidgets, AnchorWatchShared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffmitchell.anchorwatch.widgets
        SKIP_INSTALL: YES
    info:
      path: AnchorWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Anchor Watch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  AnchorWatchWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [AnchorWatchWatch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffmitchell.anchorwatch.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Anchor Watch
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.jeffmitchell.anchorwatch
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        SKIP_INSTALL: YES
  AnchorWatchTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: AnchorWatch
schemes:
  AnchorWatch:
    build:
      targets:
        AnchorWatch: all
    test:
      targets: [AnchorWatchTests]
