name: AnchorWatch
options:
  bundleIdPrefix: com.jeffmitchell
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "9"
    DEVELOPMENT_TEAM: FD52K7B8M3
    CODE_SIGN_STYLE: Automatic
targets:
  AnchorWatch:
    type: application
    platform: iOS
    sources: [AnchorWatch, AnchorWatchShared]
    dependencies:
      - target: AnchorWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffmitchell.anchorwatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: AnchorWatch/AnchorWatch.entitlements
      properties:
        # Lets the alarm notification break through Focus modes. Needs the capability on the App ID.
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: AnchorWatch/Info.plist
      properties:
        CFBundleDisplayName: Anchor Watch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [location, audio]
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSLocationWhenInUseUsageDescription: Anchor Watch uses your location to track the boat relative to the anchor.
        NSLocationAlwaysAndWhenInUseUsageDescription: Anchor Watch keeps tracking the boat while the screen is off so it can sound the drag alarm.
  AnchorWatchWidgets:
    type: app-extension
    platform: iOS
    sources: [AnchorWatchWidgets, AnchorWatchShared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffmitchell.anchorwatch.widgets
        SKIP_INSTALL: YES
    info:
      path: AnchorWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Anchor Watch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  AnchorWatchTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: AnchorWatch
schemes:
  AnchorWatch:
    build:
      targets:
        AnchorWatch: all
    test:
      targets: [AnchorWatchTests]
